[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "intelligent-delivery-orchestrator"
version = "1.0.0"
description = "Deterministic delivery orchestration with a bounded generative-AI cognitive layer"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Yan Costa Carneosso" }]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]
aws = [
  "boto3>=1.37,<2",
]

[project.scripts]
delivery-demo = "delivery_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_orchestrator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["delivery_orchestrator"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=delivery_orchestrator --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: requires deployed AWS resources and credentials",
]
