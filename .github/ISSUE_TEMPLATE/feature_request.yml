name: Feature request
description: Propose a scoped improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem, not only a preferred solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and alternatives
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, cost, and operability impact
    validations:
      required: true

