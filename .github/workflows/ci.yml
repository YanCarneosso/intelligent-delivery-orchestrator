name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pip-audit
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Schema and workflow validation
        run: python scripts/validate_repository.py
      - name: Secret-pattern scan
        run: python scripts/secret_scan.py
      - name: Dependency vulnerability audit
        run: python -m pip_audit
      - name: Tests
        run: python -m pytest -m "not integration" --junitxml=junit.xml --cov-report=xml
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn

  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Validate SAM and CloudFormation
        run: sam validate --lint
      - name: Build deployment artifacts
        run: sam build
